name: Update APK from Telegram
on:
  repository_dispatch:
    types: [update-apk]
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download APK
        run: curl -L -o MParivahan.apk "${{ github.event.client_payload.apk_url }}"
      - name: Push
        run: |
          git config user.name "bot"
          git config user.email "bot@github.com"
          git add .
          git commit -m "Update APK" || exit 0
          git push
